<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a87;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="rgba(255,255,255,0.03)"/>
  <circle cx="150" cy="530" r="150" fill="rgba(255,255,255,0.03)"/>
  
  <!-- Accent bar -->
  <rect x="80" y="200" width="8" height="120" rx="4" fill="url(#accent)"/>
  
  <!-- Brand name -->
  <text x="110" y="240" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">EL's Corner</text>
  
  <!-- Tagline -->
  <text x="110" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="rgba(255,255,255,0.8)">English Learning Online &amp; Offline</text>
  
  <!-- Description -->
  <text x="110" y="370" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="rgba(255,255,255,0.6)">Kursus Bahasa Inggris untuk Anak, Remaja, dan Dewasa</text>
  
  <!-- Features -->
  <text x="110" y="440" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)">✓ Pengajar Native  ✓ Kurikulum Internasional  ✓ Kelas Online &amp; Offline</text>
  
  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>
  
  <!-- Website -->
  <text x="600" y="580" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="rgba(255,255,255,0.4)" text-anchor="middle">elscorner.com</text>
</svg>
